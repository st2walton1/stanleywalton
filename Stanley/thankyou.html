<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Stanley Walton</title>


<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9P2X15H4QG"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
}

/* Background Grid */

body::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

/* Main Box */

.thankyou-container{
    width:90%;
    max-width:700px;
    background:linear-gradient(to bottom right,#0a0a0a,#111827);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:35px;
    padding:70px 50px;
    text-align:center;
    box-shadow:0 0 50px rgba(37,99,235,0.15);
}

/* Check Icon */

.icon{
    width:110px;
    height:110px;
    margin:auto;
    margin-bottom:35px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    box-shadow:0 0 35px rgba(37,99,235,0.4);
}

/* Heading */

h1{
    font-size:3.5rem;
    font-weight:900;
    margin-bottom:20px;
    text-transform:uppercase;
}

h1 span{
    color:#3b82f6;
}

/* Text */

p{
    color:#cbd5e1;
    font-size:18px;
    line-height:1.9;
    margin-bottom:40px;
}

/* Buttons */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:16px 35px;
    border-radius:50px;
    text-decoration:none;
    font-weight:700;
    transition:0.4s ease;
}

.primary-btn{
    background:#2563eb;
    color:white;
    box-shadow:0 0 30px rgba(37,99,235,0.3);
}

.primary-btn:hover{
    background:#1d4ed8;
    transform:translateY(-3px);
}

.secondary-btn{
    border:1px solid rgba(255,255,255,0.15);
    color:white;
}

.secondary-btn:hover{
    background:white;
    color:black;
}

/* Footer */

.footer-text{
    margin-top:45px;
    font-size:14px;
    color:#94a3b8;
}

/* Responsive */

@media(max-width:768px){

.thankyou-container{
    padding:50px 30px;
}

h1{
    font-size:2.4rem;
}

p{
    font-size:16px;
}

.buttons{
    flex-direction:column;
}

}

</style>
</head>

<body>

<div class="thankyou-container">

<div class="icon">
✔
</div>

<h1>Thank <span>You</span></h1>

<p>
Your message has been successfully sent.<br>
Thank you for reaching out to Stanley Walton.<br>
You will receive a response as soon as possible.
</p>

<div class="buttons">

<a href="index.html" class="btn primary-btn">
← Back To Portfolio
</a>

<a href="mailto:st2walton1@gmail.com" class="btn secondary-btn">
Contact Again
</a>

</div>

<div class="footer-text">
AI-Powered Administrative & Executive Virtual Assistant
</div>

</div>

</body>
</html>
